<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projekte & Archiv | Levin Production</title>
  <link rel="icon" type="image/png" href="simple-logo.png">
  <link rel="apple-touch-icon" href="simple-logo.png">
  <style>
    :root {
      --bg-color: #050507;
      --card-bg: #121216;
      --text-main: #f4f4f6;
      --text-sub: #a0a0ab;
      --accent: #d4af37;
      --border: #24242c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(5, 5, 7, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-main);
      text-decoration: none;
    }

    .logo span {
      color: var(--accent);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .lang-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .lang-switcher a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s ease;
      font-weight: 500;
    }

    .lang-switcher a:hover,
    .lang-switcher a.active {
      color: var(--accent);
      font-weight: 700;
    }

    .lang-switcher span {
      color: var(--border);
      user-select: none;
    }

    @media (max-width: 480px) {
      .header-right {
        gap: 10px;
      }
      .lang-switcher {
        gap: 5px;
        font-size: 0.78rem;
      }
    }

    .menu-wrapper {
      position: relative;
    }

    .hamburger-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--text-main);
      cursor: pointer;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .hamburger-btn:hover {
      border-color: var(--border);
      background-color: rgba(255, 255, 255, 0.04);
    }

    .hamburger-btn span {
      display: block;
      width: 22px;
      height: 2px;
      background-color: var(--text-main);
      border-radius: 2px;
      transition: all 0.25s ease;
    }

    .hamburger-btn.active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
      background-color: var(--accent);
    }

    .hamburger-btn.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger-btn.active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
      background-color: var(--accent);
    }

    .dropdown-nav {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      width: 190px;
      background-color: rgba(18, 18, 22, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 0;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.25s ease;
      z-index: 200;
    }

    .dropdown-nav.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-nav a {
      margin: 0;
      padding: 13px 22px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      border-left: 2px solid transparent;
    }

    .dropdown-nav a:hover,
    .dropdown-nav a.active {
      color: var(--accent);
      background-color: rgba(212, 175, 55, 0.06);
      border-left-color: var(--accent);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 130px 24px 90px;
    }

    .section-tag {
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      display: block;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }

    .section-desc {
      color: var(--text-sub);
      margin-bottom: 3rem;
    }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s, border-color 0.3s;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1.414;
      object-fit: cover;
      object-position: top;
      display: block;
      border-bottom: 1px solid var(--border);
    }

    .card-body {
      padding: 1.8rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-meta {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 1.3rem;
      margin-bottom: 0.8rem;
      color: var(--text-main);
    }

    .card-desc {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      flex: 1;
    }

    .card-link {
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 40px 24px;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    .footer-logo {
      display: block;
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin: 0 auto 20px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.88rem;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 50px;
      transition: all 0.25s ease;
    }

    .social-links a:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .social-links svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
