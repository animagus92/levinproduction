<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt | Levin Production</title>
  <link rel="icon" type="image/png" href="simple-logo.png">
  <link rel="apple-touch-icon" href="simple-logo.png">
  <style>
    :root {
      --bg-color: #050507;
      --card-bg: #121216;
      --text-main: #f4f4f6;
      --text-sub: #a0a0ab;
      --accent: #d4af37;
      --border: #24242c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(5, 5, 7, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-main);
      text-decoration: none;
    }

    .logo span {
      color: var(--accent);
    }

    /* Hamburger button and dropdown menu styles (Desktop & Mobile) */
    /* 언어 전환 링크 스타일 */
    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .lang-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .lang-switcher a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s ease;
      font-weight: 500;
    }

    .lang-switcher a:hover,
    .lang-switcher a.active {
      color: var(--accent);
      font-weight: 700;
    }

    .lang-switcher span {
      color: var(--border);
      user-select: none;
    }

    @media (max-width: 480px) {
      .header-right {
        gap: 10px;
      }
      .lang-switcher {
        gap: 5px;
        font-size: 0.78rem;
      }
    }

    .menu-wrapper {
      position: relative;
    }

    .hamburger-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--text-main);
      cursor: pointer;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .hamburger-btn:hover {
      border-color: var(--border);
      background-color: rgba(255, 255, 255, 0.04);
    }

    .hamburger-btn span {
      display: block;
      width: 22px;
      height: 2px;
      background-color: var(--text-main);
      border-radius: 2px;
      transition: all 0.25s ease;
    }

    .hamburger-btn.active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
      background-color: var(--accent);
    }

    .hamburger-btn.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger-btn.active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
      background-color: var(--accent);
    }

    .dropdown-nav {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      width: 190px;
      background-color: rgba(18, 18, 22, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 0;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.25s ease;
      z-index: 200;
    }

    .dropdown-nav.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-nav a {
      margin: 0;
      padding: 13px 22px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      border-left: 2px solid transparent;
    }

    .dropdown-nav a:hover,
    .dropdown-nav a.active {
      color: var(--accent);
      background-color: rgba(212, 175, 55, 0.06);
      border-left-color: var(--accent);
    }

    main {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 140px 24px 90px;
    }

    .page-tag {
      color: var(--accent);
      font-size: 0.82rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .page-desc {
      color: var(--text-sub);
      margin-bottom: 40px;
      font-size: 1rem;
    }

    .contact-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 36px 32px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-main);
      margin-bottom: 8px;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      background-color: #09090c;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 13px 16px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .btn-submit {
      width: 100%;
      padding: 15px 24px;
      background-color: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.25s;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--accent);
      color: #000000;
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .direct-info {
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .info-item span {
      display: block;
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .info-item p, .info-item a {
      color: var(--text-sub);
      font-size: 0.92rem;
      text-decoration: none;
    }

    .info-item a:hover {
      color: var(--text-main);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 40px 24px;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    .footer-logo {
      display: block;
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin: 0 auto 20px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.88rem;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 50px;
      transition: all 0.25s ease;
    }

    .social-links a:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .social-links svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .footer-info {
      line-height: 1.8;
    }

    .footer-info a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-info a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index-de.html" class="logo">LEVIN <span>PRODUCTION</span></a>
      <div class="header-right">
        <div class="lang-switcher" aria-label="Sprachauswahl">
          <a href="contact.html">한국어</a>
          <span>|</span>
          <a href="contact-en.html">English</a>
          <span>|</span>
          <a href="contact-de.html" class="active">Deutsch</a>
        </div>
        <div class="menu-wrapper">
        <button class="hamburger-btn" id="menuBtn" aria-label="Menü öffnen">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="dropdown-nav" id="dropdownNav">
          <a href="index-de.html#about">Über uns</a>
          <a href="archive-de.html">Archiv</a>
          <a href="index-de.html#upcoming">Termine</a>
        </nav>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="page-tag">Kontakt & Anfrage</div>

    <p class="page-desc">Hinterlassen Sie uns gerne Ihre Anfrage zu Konzertplanung, Künstlervermittlung, Ticketreservierungen oder Partnerschaften. Wir melden uns umgehend bei Ihnen zurück.</p>

    <div class="contact-card">
      <form id="contactForm" onsubmit="sendMail(event)">

          <label for="category">Anfrageart</label>
          <select id="category" name="category">
            <option value="Konzertplanung & Produktion">Konzertplanung & Produktion</option>
            <option value="Künstlervermittlung & Auftritte">Künstlervermittlung & Auftritte</option>
            <option value="Konzertinformationen & Ticketreservierung">Konzertinformationen & Ticketreservierung</option>
            <option value="Sponsoring & Unternehmenspartnerschaft">Sponsoring & Unternehmenspartnerschaft</option>
            <option value="Sonstige Anfrage">Sonstige Anfrage</option>
          </select>
        </div>

        <div class="form-group">
          <label for="name">Name / Institution</label>
          <input type="text" id="name" name
